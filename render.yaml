# Render Blueprint for the WAMS backend + PostgreSQL database.
# In Render: New > Blueprint, connect this repo, and it creates the web service and the database.
services:
  - type: web
    name: wams-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false          # set this to your Netlify site URL after the front-end is deployed
      - key: DATABASE_URL
        fromDatabase:
          name: wams-db
          property: connectionString

databases:
  - name: wams-db
    plan: free
